name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential openjdk-17-jdk wget unzip zip \
            libncurses5 libssl-dev libffi-dev zlib1g-dev git autoconf libtool \
            pkg-config cmake ninja-build ccache

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37
          pip install kivy==2.3.0 pillow numpy

      - name: 开始打包APK
        run: echo "y" | buildozer android debug
        timeout-minutes: 60

      - name: 上传打包好的APK
        uses: actions/upload-artifact@v4
        with:
          name: 计算器相册APK
          path: bin/*.apk
          retention-days: 30
